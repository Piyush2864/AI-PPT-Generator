services:
  - type: web
    name: ai-ppt-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install && npm run build && npx prisma generate
    startCommand: cd backend && npx prisma migrate deploy && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: ai-ppt-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-ppt-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://your-frontend-url

  - type: redis
    name: ai-ppt-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

databases:
  - name: ai-ppt-db
    databaseName: ai_ppt
    user: ai_ppt
    plan: free
